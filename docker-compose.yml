x-database-url: &db_url "postgresql://${POSTGRES_USER:-postgres_capstone_app}:${POSTGRES_PASSWORD:-capstone_app_password}@db:5432/${POSTGRES_DB:-capstone_app}"
x-test-database-url: &test_db_url "postgresql://fastapi_test:fastapi_test@fastapi_test:5432/fastapi_test"
services:
  react_app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react_app
    ports:
      - "4173:80"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
    environment:
      VITE_FASTAPI_URL: http://fastapi_app:8080
      VITE_AUTH_API_URL: http://goauth:3001
    restart: always
    networks:
      - app_network
  fastapi_app:
    build:
      context: ./backend/fastapi
      dockerfile: Dockerfile
    container_name: fastapi_app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: *db_url
      TEST_DB_URL: *test_db_url
      REDIS_URL: ${REDIS_URL}
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:4173"
    restart: always
    networks:
      - app_network
  goauth:
    build:
      context: ./backend/auth
      dockerfile: Dockerfile
    container_name: go_auth_service
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    environment:
      AUTH_SERVER_PORT: 3001
      DATABASE_URL: *db_url
      DISCUSSION_APP_SESSION_KEY: ${DISCUSSION_APP_SESSION_KEY:-26a57a41b90e2240c8b644b0fae0d4abfaa298ea}
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:4173"
    restart: always
    networks:
      - app_network
  db:
    image: postgres:15
    container_name: app_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres_capstone_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capstone_app_password}
      POSTGRES_DB: ${POSTGRES_DB:-capstone_app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - app_network
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER:-postgres_capstone_app} -d ${POSTGRES_DB:-capstone_app}"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  test_db:
    image: postgres:15
    container_name: test_db
    restart: always
    environment:
      POSTGRES_USER: fastapi_test
      POSTGRES_PASSWORD: fastapi_test
      POSTGRES_DB: fastapi_test
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
      - ./testdb/init:/docker-entrypoint-initdb.d
    networks:
      - app_network
    ports:
      - "5433:5432"  # Using different port to avoid app db conflict
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U fastapi_test -d fastapi_test"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
networks:
  app_network:
    driver: bridge
volumes:
  postgres_data:
  test_postgres_data:
